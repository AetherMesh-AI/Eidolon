name: Manual Eidolon alpha release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'New alpha tag matching committed desktop version (first: alpha-v0.1.0)'
        type: string
        required: true
        default: alpha-v0.1.0
      changelog:
        description: 'Release notes as Markdown CONTENT, not a filename; never stored in the repository'
        type: string
        required: true

permissions:
  contents: read

# Serialize all manual releases, including different tags. Never cancel a publisher.
concurrency:
  group: eidolon-manual-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version_tag }}
  RELEASE_CHANGELOG: ${{ inputs.changelog }}

jobs:
  preflight:
    if: github.repository == 'AetherMesh-AI/Eidolon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline release policy tests
        run: python3 -m unittest discover -s .github/scripts -p test_manual_release.py
      - name: Validate inputs and refuse existing tags or releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/manual_release.py preflight

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Native locked workspace install
        run: npm ci --include=dev --include=optional
      - name: Linux Electron runtime libraries for native addon smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Locate full 7-Zip for NSIS inspection
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $seven = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (-not $seven) {
            $dir = Join-Path $env:ProgramFiles '7-Zip'
            if (-not (Test-Path (Join-Path $dir '7z.exe'))) { throw 'Full 7-Zip is required for NSIS inspection' }
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build desktop and native payload on target architecture
        run: npm run build --workspace apps/desktop
      - name: Package one installer or AppImage and verify native payload
        run: python .github/scripts/manual_release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/eidolon-release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Create new tag, stage draft, verify exactly five assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: python3 .github/scripts/manual_release.py publish
